spring.application.name=api
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.remote.secret=mysecret

# Database Configuration
spring.datasource.url=jdbc:mysql://mysql:3306/devall?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=devall
spring.datasource.password=devall
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate (JPA) Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Port
server.port=8080

# Documentation
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.url=/openapi.yml      

spring.docker.compose.enabled=false